# Release builds of loxone-mcp for a v* tag; .github/workflows/release.yml runs it.
version: 2

project_name: loxone-mcp

builds:
  - id: loxone-mcp
    main: ./cmd/loxone-mcp
    binary: loxone-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ if not .IsSnapshot }}{{ .Tag }}{{ else }}dev{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: loxone-mcp
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
      mode: 0755
    files:
      - src: README.md
        info: &file-info
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0644
      - src: examples/home.yaml
        info: *file-info

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^(build|chore|ci|docs|style|test)(\\(.+\\))?!?:"
  groups:
    - title: Features
      regexp: "^feat(\\(.+\\))?!?:"
      order: 0
    - title: Fixes
      regexp: "^fix(\\(.+\\))?!?:"
      order: 1
    - title: Other changes
      order: 999

release:
  draft: false
  prerelease: auto
